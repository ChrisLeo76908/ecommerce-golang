<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <header>
        <h1>Productos Disponibles</h1>
    </header>

    <nav class="menu">

        <div>
            <a href="/">Inicio</a>
            <a href="/productos">Productos</a>
            <a href="/carrito">Carrito</a>
        </div>

        <div>
            <a href="/login">Login</a>
        </div>

    </nav>

    <div class="container">

        {{range .}}

        <div class="card">

            <img src="{{.Imagen}}" width="250">

            <h2>{{.Nombre}}</h2>

            <p>Precio: ${{.Precio}}</p>

            <a href="/agregar?id={{.ID}}">
                <button>
                    Agregar al carrito
                </button>
            </a>

        </div>

        <br>

        {{end}}

    </div>

</body>

</html>
